<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Directory - ServiceHub Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top px-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white" href="admin-dashboard.html">
                <i class="bi bi-headset text-primary fs-4"></i> ServiceHub <span class="badge bg-danger ms-2 small" style="font-size:0.65rem;">ADMIN PANEL</span>
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <div class="dropdown">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle d-flex align-items-center gap-2 rounded-pill px-3" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-shield-lock-fill fs-5 text-warning"></i>
                        <span id="headerUserName">Admin</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                        <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><a class="dropdown-item text-danger" href="#" onclick="AuthService.logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 bg-sidebar p-0 sidebar">
                <div class="py-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="admin-dashboard.html"><i class="bi bi-grid-fill"></i> Admin Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="admin-requests.html"><i class="bi bi-ticket-detailed-fill"></i> All Requests</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="admin-staff.html"><i class="bi bi-people-fill"></i> Manage Staff</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="admin-users.html"><i class="bi bi-person-lines-fill"></i> Manage Users</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="admin-feedback.html"><i class="bi bi-star-fill text-warning"></i> Feedback</a>
                        </li>
                        <li class="nav-item mt-4">
                            <a class="nav-link text-danger" href="#" onclick="AuthService.logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="col-md-9 col-lg-10 p-4">
                <div class="mb-4">
                    <h4 class="fw-bold mb-1">Registered Users Directory</h4>
                    <p class="text-muted small mb-0">Overview of registered organization members and system accounts</p>
                </div>

                <!-- Users Table -->
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">User ID</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Registered Date</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTableBody">
                                    <tr>
                                        <td colspan="5" class="text-center py-4 text-muted">Loading users...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        AuthService.requireAuth('ADMIN');

        async function loadUsers() {
            try {
                const users = await ApiClient.get('/users');
                const tbody = document.getElementById('usersTableBody');

                if (users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted">No users found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = users.map(u => `
                    <tr>
                        <td class="ps-4 font-monospace small">#${u.id}</td>
                        <td class="fw-semibold">${u.name}</td>
                        <td class="small text-muted">${u.email}</td>
                        <td>
                            <span class="badge ${u.role === 'ADMIN' ? 'bg-danger' : 'bg-primary'}">${u.role}</span>
                        </td>
                        <td class="small text-muted">${formatDate(u.createdAt)}</td>
                    </tr>
                `).join('');

            } catch (err) {
                showToast(err.message || 'Error loading users', 'error');
            }
        }

        loadUsers();
    </script>
</body>
</html>

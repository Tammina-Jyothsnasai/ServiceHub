<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback - ServiceHub Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top px-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white" href="admin-dashboard.html">
                <i class="bi bi-headset text-primary fs-4"></i> ServiceHub <span class="badge bg-danger ms-2 small" style="font-size:0.65rem;">ADMIN PANEL</span>
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <div class="dropdown">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle d-flex align-items-center gap-2 rounded-pill px-3" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-shield-lock-fill fs-5 text-warning"></i>
                        <span id="headerUserName">Admin</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                        <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><a class="dropdown-item text-danger" href="#" onclick="AuthService.logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 bg-sidebar p-0 sidebar">
                <div class="py-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="admin-dashboard.html"><i class="bi bi-grid-fill"></i> Admin Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="admin-requests.html"><i class="bi bi-ticket-detailed-fill"></i> All Requests</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="admin-staff.html"><i class="bi bi-people-fill"></i> Manage Staff</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="admin-users.html"><i class="bi bi-person-lines-fill"></i> Manage Users</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="admin-feedback.html"><i class="bi bi-star-fill text-warning"></i> Feedback</a>
                        </li>
                        <li class="nav-item mt-4">
                            <a class="nav-link text-danger" href="#" onclick="AuthService.logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="col-md-9 col-lg-10 p-4">
                <div class="mb-4">
                    <h4 class="fw-bold mb-1">User Resolution Feedback</h4>
                    <p class="text-muted small mb-0">Ratings and reviews submitted by users following ticket resolution</p>
                </div>

                <!-- Feedback List -->
                <div class="row g-4" id="feedbackListContainer">
                    <div class="col-12 text-center py-5 text-muted">Loading feedback...</div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        AuthService.requireAuth('ADMIN');

        async function loadFeedbackList() {
            try {
                const list = await ApiClient.get('/feedback');
                const container = document.getElementById('feedbackListContainer');

                if (list.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5 text-muted">
                            <i class="bi bi-star-half fs-1 d-block mb-2 text-warning"></i>
                            No feedback submitted yet.
                        </div>
                    `;
                    return;
                }

                container.innerHTML = list.map(f => {
                    let starsHtml = '';
                    for (let i = 1; i <= 5; i++) {
                        if (i <= f.rating) starsHtml += '<i class="bi bi-star-fill text-warning me-1"></i>';
                        else starsHtml += '<i class="bi bi-star text-muted me-1"></i>';
                    }

                    return `
                        <div class="col-md-6">
                            <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <div>
                                        <span class="badge bg-primary-subtle text-primary border me-2">${f.requestTicketId}</span>
                                        <span class="fw-bold text-dark">${f.requestTitle}</span>
                                    </div>
                                    <div class="fs-6">${starsHtml}</div>
                                </div>
                                <p class="text-muted small mb-3 fst-italic">"${f.comment || 'No comment provided'}"</p>
                                <div class="d-flex justify-content-between align-items-center pt-2 border-top mt-auto">
                                    <span class="small fw-semibold text-dark"><i class="bi bi-person me-1"></i>${f.userName}</span>
                                    <small class="text-muted" style="font-size:0.75rem;">${formatDate(f.createdAt)}</small>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                showToast(err.message || 'Error loading feedback', 'error');
            }
        }

        loadFeedbackList();
    </script>
</body>
</html>

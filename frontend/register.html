<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ServiceHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 shadow-lg rounded-4 p-4">
                    <div class="text-center mb-4">
                        <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none fs-3 fw-bold text-primary mb-2">
                            <i class="bi bi-headset fs-2"></i> Service<span class="text-dark">Hub</span>
                        </a>
                        <h5 class="fw-bold text-dark">Create Account</h5>
                        <p class="text-muted small">Register to log service tickets and track resolutions</p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Full Name</label>
                            <input type="text" id="name" class="form-control" placeholder="e.g. John Doe" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Email Address</label>
                            <input type="email" id="email" class="form-control" placeholder="name@organization.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Confirm Password</label>
                            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
                        </div>

                        <button type="submit" id="registerBtn" class="btn btn-primary w-100 py-2 rounded-3 fw-bold mb-3">
                            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
                            <span id="btnText">Create Account</span>
                        </button>
                    </form>

                    <div class="text-center">
                        <small class="text-muted">Already have an account? <a href="login.html" class="fw-bold text-primary text-decoration-none">Sign in here</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showToast('Passwords do not match!', 'error');
                return;
            }

            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            const registerBtn = document.getElementById('registerBtn');

            btnSpinner.classList.remove('d-none');
            btnText.textContent = 'Registering...';
            registerBtn.disabled = true;

            try {
                const response = await ApiClient.post('/auth/register', { name, email, password, confirmPassword });
                showToast('Account created successfully! Please login.', 'success');

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1200);

            } catch (err) {
                showToast(err.message || 'Registration failed', 'error');
                btnSpinner.classList.add('d-none');
                btnText.textContent = 'Create Account';
                registerBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

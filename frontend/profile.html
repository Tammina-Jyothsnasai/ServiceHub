<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ServiceHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top px-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white" href="dashboard.html">
                <i class="bi bi-headset text-primary fs-4"></i> ServiceHub
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <div class="dropdown">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle d-flex align-items-center gap-2 rounded-pill px-3" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-5"></i>
                        <span id="headerUserName">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                        <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><a class="dropdown-item text-danger" href="#" onclick="AuthService.logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 bg-sidebar p-0 sidebar">
                <div class="py-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html" id="dashLink"><i class="bi bi-grid-fill"></i> Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="profile.html"><i class="bi bi-person-badge"></i> Profile</a>
                        </li>
                        <li class="nav-item mt-4">
                            <a class="nav-link text-danger" href="#" onclick="AuthService.logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="col-md-9 col-lg-10 p-4">
                <div class="mb-4">
                    <h4 class="fw-bold mb-1">User Profile</h4>
                    <p class="text-muted small mb-0">Your account details and security permissions</p>
                </div>

                <div class="row justify-content-center">
                    <div class="col-lg-6">
                        <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
                            <div class="stat-icon icon-total mx-auto mb-3" style="width:72px;height:72px;font-size:2.2rem;">
                                <i class="bi bi-person-circle"></i>
                            </div>
                            <h4 class="fw-bold mb-1" id="profName">-</h4>
                            <p class="text-muted mb-3" id="profEmail">-</p>
                            <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill mx-auto mb-4" id="profRole">USER</span>

                            <div class="text-start bg-light p-3 rounded-3 border">
                                <div class="mb-2">
                                    <small class="text-muted d-block">Account Type</small>
                                    <span class="fw-semibold text-dark">Organization Member</span>
                                </div>
                                <div>
                                    <small class="text-muted d-block">System Status</small>
                                    <span class="badge bg-success-subtle text-success border border-success-subtle">ACTIVE</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        AuthService.requireAuth();
        const user = AuthService.getUser();

        if (user.role === 'ADMIN') {
            document.getElementById('dashLink').href = 'admin-dashboard.html';
        }

        document.getElementById('profName').textContent = user.name;
        document.getElementById('profEmail').textContent = user.email;
        document.getElementById('profRole').textContent = user.role;
    </script>
</body>
</html>

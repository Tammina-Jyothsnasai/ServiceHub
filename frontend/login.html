<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ServiceHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 shadow-lg rounded-4 p-4">
                    <div class="text-center mb-4">
                        <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none fs-3 fw-bold text-primary mb-2">
                            <i class="bi bi-headset fs-2"></i> Service<span class="text-dark">Hub</span>
                        </a>
                        <h5 class="fw-bold text-dark">Welcome Back</h5>
                        <p class="text-muted small">Sign in to track and manage service requests</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" class="form-control" placeholder="name@organization.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn"><i class="bi bi-eye"></i></button>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label small" for="rememberMe">Remember me</label>
                            </div>
                        </div>

                        <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 rounded-3 fw-bold mb-3">
                            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
                            <span id="btnText">Sign In</span>
                        </button>
                    </form>

                    <!-- Quick Demo Credentials helper box -->
                    <div class="alert alert-info border-0 rounded-3 p-3 mb-3 small">
                        <strong class="d-block mb-1"><i class="bi bi-info-circle-fill me-1"></i> Quick Demo Login Credentials:</strong>
                        <div><strong>Admin:</strong> <code>admin@servicehub.com</code> / <code>Admin@123</code></div>
                        <div><strong>User:</strong> <code>rahul@servicehub.com</code> / <code>User@123</code></div>
                    </div>

                    <div class="text-center">
                        <small class="text-muted">Don't have an account? <a href="register.html" class="fw-bold text-primary text-decoration-none">Register here</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('togglePasswordBtn').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            const loginBtn = document.getElementById('loginBtn');

            btnSpinner.classList.remove('d-none');
            btnText.textContent = 'Authenticating...';
            loginBtn.disabled = true;

            try {
                const response = await ApiClient.post('/auth/login', { email, password });
                AuthService.setUser(response);
                showToast('Login successful! Redirecting...', 'success');

                setTimeout(() => {
                    if (response.role === 'ADMIN') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 800);

            } catch (err) {
                showToast(err.message || 'Invalid email or password', 'error');
                btnSpinner.classList.add('d-none');
                btnText.textContent = 'Sign In';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
